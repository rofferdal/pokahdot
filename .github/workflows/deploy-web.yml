name: Deploy Web release

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full lowercase 40-character commit SHA to deploy
        required: true
        type: string
      reviewed_local_evidence_url:
        description: HTTPS URL for reviewed local GUI evidence
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2
  GODOT_RELEASE: 4.7.2-stable
  GODOT_TEMPLATE_VERSION: 4.7.2.stable

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate candidate provenance
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          REVIEWED_LOCAL_EVIDENCE_URL: ${{ inputs.reviewed_local_evidence_url }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$WORKFLOW_REF" = "refs/heads/main" || {
            echo "Deploy Web release must be dispatched from the main branch workflow." >&2
            exit 1
          }
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "candidate_sha must be a full lowercase 40-character commit SHA." >&2
            exit 1
          }
          [[ "$REVIEWED_LOCAL_EVIDENCE_URL" =~ ^https://[^[:space:]]+$ ]] || {
            echo "reviewed_local_evidence_url must be one non-empty HTTPS URL without whitespace." >&2
            exit 1
          }
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor "$CANDIDATE_SHA" origin/main

          {
            echo "### Web release candidate"
            echo "- Candidate SHA: \`$CANDIDATE_SHA\`"
            echo "- Reviewed local evidence: [$REVIEWED_LOCAL_EVIDENCE_URL]($REVIEWED_LOCAL_EVIDENCE_URL)"
            echo "- Provenance: main workflow, exact SHA, clean tree, and ancestor of \`origin/main\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned Godot editor and export templates
        shell: bash
        run: |
          set -euo pipefail
          godot_archive="Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          templates_archive="Godot_v${GODOT_RELEASE}_export_templates.tpz"
          release_url="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"

          curl --fail --location --retry 3 --output "/tmp/${godot_archive}" "${release_url}/${godot_archive}"
          unzip -q "/tmp/${godot_archive}" -d "$RUNNER_TEMP/godot"
          install -m 0755 "$RUNNER_TEMP/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"

          template_dir="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}"
          template_unpack_dir="$RUNNER_TEMP/export-templates"
          mkdir -p "$template_dir"
          curl --fail --location --retry 3 --output "/tmp/${templates_archive}" "${release_url}/${templates_archive}"
          unzip -q "/tmp/${templates_archive}" -d "$template_unpack_dir"
          test -f "$template_unpack_dir/templates/web_nothreads_debug.zip"
          test -f "$template_unpack_dir/templates/web_nothreads_release.zip"
          cp "$template_unpack_dir/templates/web_nothreads_debug.zip" "$template_dir/"
          cp "$template_unpack_dir/templates/web_nothreads_release.zip" "$template_dir/"

      - name: Install pinned development tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --requirement requirements-dev.txt

      - name: Validate and export the release artifact
        run: make release-candidate-gate web-release

      - name: Prevent Jekyll processing
        run: touch build/web/.nojekyll

      - name: Upload Web release artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Publish deployment URL
        run: 'echo "Deployed URL: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"'
