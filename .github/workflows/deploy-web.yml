name: Deploy Web release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2
  GODOT_RELEASE: 4.7.2-stable
  GODOT_TEMPLATE_VERSION: 4.7.2.stable

jobs:
  quality:
    uses: ./.github/workflows/check-quality.yml

  native-layouts:
    uses: ./.github/workflows/check-native-layouts.yml
    with:
      run-matrix-tests: ${{ vars.RUN_GUI_MATRIX_TESTS == 'true' }}

  build:
    needs: [quality, native-layouts]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out release commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record deployment provenance
        shell: bash
        env:
          DEPLOYED_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$WORKFLOW_REF" = "refs/heads/main" || {
            echo "Deploy Web release only accepts pushes to main." >&2
            exit 1
          }
          test "$(git rev-parse HEAD)" = "$DEPLOYED_SHA"
          test -z "$(git status --porcelain)"

          {
            echo "### Web deployment"
            echo "- Commit SHA: \`$DEPLOYED_SHA\`"
            echo "- Provenance: push to \`main\`, exact checked-out SHA, and clean tree"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install pinned Godot editor and export templates
        shell: bash
        run: |
          set -euo pipefail
          godot_archive="Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          templates_archive="Godot_v${GODOT_RELEASE}_export_templates.tpz"
          release_url="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"

          curl --fail --location --retry 3 --output "/tmp/${godot_archive}" "${release_url}/${godot_archive}"
          unzip -q "/tmp/${godot_archive}" -d "$RUNNER_TEMP/godot"
          install -m 0755 "$RUNNER_TEMP/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"

          template_dir="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}"
          template_unpack_dir="$RUNNER_TEMP/export-templates"
          mkdir -p "$template_dir"
          curl --fail --location --retry 3 --output "/tmp/${templates_archive}" "${release_url}/${templates_archive}"
          unzip -q "/tmp/${templates_archive}" -d "$template_unpack_dir"
          test -f "$template_unpack_dir/templates/web_nothreads_debug.zip"
          test -f "$template_unpack_dir/templates/web_nothreads_release.zip"
          cp "$template_unpack_dir/templates/web_nothreads_debug.zip" "$template_dir/"
          cp "$template_unpack_dir/templates/web_nothreads_release.zip" "$template_dir/"

      - name: Export the validated release commit
        run: |
          make require-clean-worktree
          mkdir -p build/web
          godot --headless --path . --import
          godot --headless --path . --export-release "Web" build/web/index.html
          make verify-web-release-output
          make require-clean-worktree

      - name: Prevent Jekyll processing
        run: touch build/web/.nojekyll

      - name: Upload Web release artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Publish deployment URL
        run: 'echo "Deployed URL: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"'
