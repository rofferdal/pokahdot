name: Shared native layout checks

on:
  workflow_call:
    inputs:
      run-matrix-tests:
        description: Run the optional *_matrix_runner.gd suites
        type: boolean
        default: false

      run-gui-tests:
        description: Include test_gui_*.gd suites
        type: boolean
        default: false

permissions:
  contents: read

env:
  GODOT_RELEASE: 4.7.2-stable

jobs:
  selection:
    name: Select optional native tests
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.selection.outputs.targets }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: selection
        env:
          RUN_GUI_TESTS: ${{ inputs.run-gui-tests }}
          RUN_GUI_MATRIX_TESTS: ${{ inputs.run-matrix-tests }}
        run: python3 tools/ci_test_selection.py

  layouts:
    needs: selection
    if: needs.selection.outputs.targets != '[]'

    name: Native layout / ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.selection.outputs.targets) }}
    steps:
      - name: Check out proposed commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Record runner hardware
        run: |
          lscpu
          free -h

      - name: Install pinned Godot editor
        shell: bash
        run: |
          set -euo pipefail
          godot_archive="Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          release_url="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          curl --fail --location --retry 3 --output "/tmp/${godot_archive}" "${release_url}/${godot_archive}"
          unzip -q "/tmp/${godot_archive}" -d "$RUNNER_TEMP/godot"
          install -m 0755 "$RUNNER_TEMP/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"

      - name: Import project resources
        run: godot --headless --path . --import

      - name: Validate this layout group
        env:
          LAYOUT_TARGET: ${{ matrix.target }}
        run: |
          make require-clean-worktree
          mkdir -p localtmp/ci-layout
          make "$LAYOUT_TARGET" GUT_REPORT=res://localtmp/ci-layout/layout.xml
          make require-clean-worktree
      - name: Validate coverage and summarize slow tests
        # Required after successful checks; earlier failures may leave no report.
        if: success()
        run: python3 tools/summarize_gut_report.py localtmp/ci-layout/layout.xml

      - name: Retain test timing report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-layout-${{ matrix.target }}
          path: |
            localtmp/ci-layout/*.xml
            localtmp/ci-layout/*.gutconfig.json
          if-no-files-found: warn

  complete:
    name: Validate native test selection
    needs: [selection, layouts]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require enabled suites and allow only intentional skips
        env:
          SELECTION_RESULT: ${{ needs.selection.result }}
          LAYOUT_RESULT: ${{ needs.layouts.result }}
          TARGETS: ${{ needs.selection.outputs.targets }}
        run: |
          test "$SELECTION_RESULT" = success
          if [ "$TARGETS" = '[]' ]; then
            test "$LAYOUT_RESULT" = skipped
          else
            test "$LAYOUT_RESULT" = success
          fi
