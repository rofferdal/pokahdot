name: Shared quality checks

on:
  workflow_call:

permissions:
  contents: read

env:
  GODOT_RELEASE: 4.7.2-stable

jobs:
  quality:
    name: Rules, tooling and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed merge
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Record runner hardware
        run: |
          lscpu
          free -h

      - name: Install pinned Godot editor
        shell: bash
        run: |
          set -euo pipefail
          godot_archive="Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          release_url="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          curl --fail --location --retry 3 --output "/tmp/${godot_archive}" "${release_url}/${godot_archive}"
          unzip -q "/tmp/${godot_archive}" -d "$RUNNER_TEMP/godot"
          install -m 0755 "$RUNNER_TEMP/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"

      - name: Install pinned development tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --requirement requirements-dev.txt

      - name: Validate the clean proposed commit
        run: |
          make require-clean-worktree
          make ci-quality-check
          make require-clean-worktree

      - name: Validate coverage and summarize slow tests
        if: always()
        run: python3 tools/summarize_gut_report.py localtmp/ci-layout/quality.xml --config localtmp/ci-layout/quality.gutconfig.json

      - name: Retain test timing report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quality-gut-timings
          path: |
            localtmp/ci-layout/*.xml
            localtmp/ci-layout/*.gutconfig.json
          if-no-files-found: warn
